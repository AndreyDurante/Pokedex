<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Pokédex</title>
</head>
<body class="poppins-regular">
    <section id="conteudo">
        <main class="card">
            <article id="descricao">
                <p id="nome" class="descricoes"></p>
                <p id="tipo" class="descricoes"></p>
                <p id="peso" class="descricoes"></p>
                <p id="movimento" class="descricoes"></p>
            </article>
            <div >
                <img src="" alt="imagem-pokemon" id="imagens">
            </div>
        </main>
    </section>

    <div id="secaoInput">
        <input id="inputPokemon" type="text" placeholder="Digite o número do Pokemon para buscar na Pokédex">
        <button type="submit" id="botao">Procurar</button>
    </div>

    <section id="cardsCriados">
        <h1>Cards previamente vistos</h1>
        <main id="cardsPrevios">
        </main>
    </section>
    <script src="./script.js"></script>
</body>
</html>
